<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>Vpmify</title>
</head>
<body>
<main id="drop" data-file-drop-target>
    <header class="top">
        <h1>Vpmify</h1>
        <div class="actions">
            <span id="spinner" class="spinner" data-i18n-title="app.working" hidden></span>
            <select id="language" data-i18n-title="app.language">
                <option value="en">English</option>
                <option value="ja">日本語</option>
            </select>
            <button id="choose" type="button" data-i18n="app.addFiles"></button>
        </div>
    </header>
    <p class="hint" data-i18n="app.dropHint"></p>
    <p id="error" class="error" hidden></p>

    <section id="confirm-section" hidden>
        <div id="confirm" class="card"></div>
    </section>

    <section id="pending-section" hidden>
        <h2 data-i18n="pending.title"></h2>
        <div id="pending"></div>
    </section>

    <section>
        <header>
            <h2 data-i18n="recipes.title"></h2>
            <button id="update-all" type="button" data-i18n="recipes.updateAll"></button>
        </header>
        <table>
            <thead>
            <tr><th data-i18n="col.recipe"></th><th data-i18n="col.packages"></th><th data-i18n="col.problem"></th></tr>
            </thead>
            <tbody id="recipes"></tbody>
        </table>
        <p id="no-recipes" data-i18n="recipes.none" hidden></p>
    </section>

    <section id="versions-section" hidden>
        <header>
            <h2 id="versions-title"></h2>
            <div class="actions">
                <label><input id="prereleases" type="checkbox"/> <span data-i18n="versions.prereleases"></span></label>
                <button id="update" type="button" data-i18n="versions.update"></button>
                <button id="pull-newest" type="button" data-i18n="versions.pullNewest"></button>
                <button id="remove-recipe" type="button" data-i18n="versions.removeRecipe"></button>
            </div>
        </header>
        <p id="versions-updated" class="note"></p>
        <table>
            <thead>
            <tr><th data-i18n="col.version"></th><th data-i18n="col.unity"></th><th data-i18n="col.from"></th><th data-i18n="col.available"></th><th></th></tr>
            </thead>
            <tbody id="versions"></tbody>
        </table>
        <p id="no-versions" data-i18n="versions.none" hidden></p>
    </section>

    <section>
        <header>
            <h2 data-i18n="available.title"></h2>
            <button id="reload" type="button" data-i18n="available.reload"></button>
        </header>
        <p id="settings-error" class="error" hidden></p>
        <table>
            <thead>
            <tr><th data-i18n="col.recipe"></th><th data-i18n="col.package"></th><th data-i18n="col.version"></th><th data-i18n="col.unity"></th><th data-i18n="col.alcom"></th></tr>
            </thead>
            <tbody id="entries"></tbody>
        </table>
        <p id="empty" data-i18n="available.none" hidden></p>
    </section>

    <section>
        <h2 data-i18n="log.title"></h2>
        <pre id="log"></pre>
    </section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
